name: Release BetterWheelWizard

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore WheelWizard.sln

      - name: Run tests
        run: dotnet test WheelWizard.sln --configuration Release --no-restore --verbosity normal

      - name: Publish Windows x64
        run: >
          dotnet publish WheelWizard/WheelWizard.csproj
          --runtime win-x64
          --configuration Release
          --output publish/win-x64
          --self-contained true
          /p:UseAppHost=true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Publish Linux x64
        run: >
          dotnet publish WheelWizard/WheelWizard.csproj
          --runtime linux-x64
          --configuration Release
          --output publish/linux-x64
          --self-contained true
          /p:UseAppHost=true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Publish Linux ARM64
        run: >
          dotnet publish WheelWizard/WheelWizard.csproj
          --runtime linux-arm64
          --configuration Release
          --output publish/linux-arm64
          --self-contained true
          /p:UseAppHost=true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Stage release assets
        run: |
          mkdir -p artifacts
          cp publish/win-x64/BetterWheelWizard.exe artifacts/BetterWheelWizardWindows.exe
          cp publish/linux-x64/BetterWheelWizard artifacts/BetterWheelWizard_Linux
          cp publish/linux-arm64/BetterWheelWizard artifacts/BetterWheelWizard_ARM64_Linux
          chmod +x artifacts/BetterWheelWizard_Linux artifacts/BetterWheelWizard_ARM64_Linux

      - name: Upload Linux + Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: artifacts-linux-windows
          path: artifacts/
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # macOS builds (native on macOS runner)
  # ──────────────────────────────────────────────────────────────
  macos-arm64:
    name: Build macOS (arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Build .app bundle for macOS arm64
        run: |
          chmod +x macos/release-macos.sh
          ./macos/release-macos.sh
        env:
          BUILD_ARCH: arm64

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          # Write the certificate from the secret
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12

          # Create a temporary keychain
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain

          # Import the certificate
          security import certificate.p12 -k build.keychain \
            -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign

          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain

          # Verify the import
          echo "[INFO] Available signing identities:"
          security find-identity -v -p basic
          rm certificate.p12

      - name: Sign the .app bundle with Developer ID
        run: |
          ENTITLEMENTS="${{ github.workspace }}/macos/certs/WheelWizardEntitlements.entitlements"
          APP_PATH="release/WheelWizard.app"
          SIGNING_IDENTITY="Developer ID Application: Gabriel Magaña (Z4D7MUNZ97)"

          # List available identities for debugging
          echo "[INFO] Checking signing identities..."
          security find-identity -v -p codesigning

          # Sign all executables inside the bundle first
          find "$APP_PATH/Contents/MacOS" -type f | while read fname; do
            echo "[INFO] Signing $fname"
            codesign --force --timestamp --options=runtime \
              --entitlements "$ENTITLEMENTS" \
              --sign "$SIGNING_IDENTITY" "$fname"
          done

          # Sign the .app bundle itself
          echo "[INFO] Signing .app bundle"
          codesign --force --timestamp --options=runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGNING_IDENTITY" "$APP_PATH"

      - name: Create DMG
        id: create-dmg
        uses: L-Super/create-dmg-actions@8c59360de7ec731bfa03ce3bd2ad5ae650169864 # v1
        with:
          dmg_name: WheelWizard-macOSarm64
          src_dir: release/WheelWizard.app
          background: macos/backgr.png
          window_size: 650 376
          icon_size: 128
          icon_position: 200 150
          app_drop_link: 450 150

      - name: Notarize and staple the .app
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          # Notarize the .app bundle
          ditto -c -k --sequesterRsrc --keepParent \
            release/WheelWizard.app \
            WheelWizard-app-notarize.zip
          xcrun notarytool submit WheelWizard-app-notarize.zip \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --wait
          rm WheelWizard-app-notarize.zip
          xcrun stapler staple release/WheelWizard.app

      - name: Notarize the DMG
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          xcrun notarytool submit WheelWizard-macOSarm64.dmg \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --wait
          xcrun stapler staple WheelWizard-macOSarm64.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-macos-arm64
          path: WheelWizard-macOSarm64.dmg
          retention-days: 1

  macos-x64:
    name: Build macOS (x64)
    # Cross-compile x64 on an arm64 runner since macos-13 (Intel) is deprecated.
    # .NET handles cross-compilation via the runtime identifier (osx-x64).
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"

      - name: Build .app bundle for macOS x64
        run: |
          chmod +x macos/release-macos.sh
          ./macos/release-macos.sh
        env:
          BUILD_ARCH: x64

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp build.keychain
          rm certificate.p12

      - name: Sign the .app bundle with Developer ID
        run: |
          ENTITLEMENTS="${{ github.workspace }}/macos/certs/WheelWizardEntitlements.entitlements"
          APP_PATH="release/WheelWizard.app"
          SIGNING_IDENTITY="Developer ID Application: Gabriel Magaña (Z4D7MUNZ97)"

          # Sign all executables inside the bundle first
          find "$APP_PATH/Contents/MacOS" -type f | while read fname; do
            echo "[INFO] Signing $fname"
            codesign --force --timestamp --options=runtime \
              --entitlements "$ENTITLEMENTS" \
              --sign "$SIGNING_IDENTITY" "$fname"
          done

          # Sign the .app bundle itself
          echo "[INFO] Signing .app bundle"
          codesign --force --timestamp --options=runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGNING_IDENTITY" "$APP_PATH"

      - name: Create DMG
        id: create-dmg
        uses: L-Super/create-dmg-actions@8c59360de7ec731bfa03ce3bd2ad5ae650169864 # v1
        with:
          dmg_name: WheelWizard-macOSintel
          src_dir: release/WheelWizard.app
          background: macos/backgr.png
          window_size: 650 376
          icon_size: 128
          icon_position: 200 150
          app_drop_link: 450 150

      - name: Notarize and staple the .app
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          # Notarize the .app bundle
          ditto -c -k --sequesterRsrc --keepParent \
            release/WheelWizard.app \
            WheelWizard-app-notarize.zip
          xcrun notarytool submit WheelWizard-app-notarize.zip \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --wait
          rm WheelWizard-app-notarize.zip
          xcrun stapler staple release/WheelWizard.app

      - name: Notarize the DMG
        env:
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          MACOS_NOTARY_APP_PASSWORD: ${{ secrets.MACOS_NOTARY_APP_PASSWORD }}
        run: |
          xcrun notarytool submit WheelWizard-macOSintel.dmg \
            --apple-id "$MACOS_NOTARY_APPLE_ID" \
            --team-id "$MACOS_NOTARY_TEAM_ID" \
            --password "$MACOS_NOTARY_APP_PASSWORD" \
            --wait
          xcrun stapler staple WheelWizard-macOSintel.dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artifacts-macos-x64
          path: WheelWizard-macOSintel.dmg
          retention-days: 1

  # ──────────────────────────────────────────────────────────────
  # Create GitHub release with all assets
  # ──────────────────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [release, macos-arm64, macos-x64]
    # The Windows/Linux build is the one that must succeed. A failed macOS job (signing,
    # notarization) must not hold the other platforms hostage: the release goes out without the
    # DMGs, and the in-app updater already picks the newest release that has an asset for the
    # user's platform, so macOS users simply stay on their current version until a later release
    # carries DMGs again.
    if: ${{ !cancelled() && needs.release.result == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1

      - name: Prepare release assets
        run: |
          mkdir -p final-artifacts

          # download-artifact has changed its default extraction layout between major
          # versions, so locate required assets by name instead of assuming a directory.
          copy_required_asset() {
            asset_name="$1"
            asset_path="$(find . -type f -name "$asset_name" -print -quit)"
            if [ -z "$asset_path" ]; then
              echo "::error::$asset_name was not found in the downloaded artifacts."
              exit 1
            fi
            cp "$asset_path" final-artifacts/
          }

          copy_required_asset BetterWheelWizardWindows.exe
          copy_required_asset BetterWheelWizard_Linux
          copy_required_asset BetterWheelWizard_ARM64_Linux

          # macOS DMGs: attached when their job produced them, skipped with a warning otherwise.
          for dmg_name in WheelWizard-macOSarm64.dmg WheelWizard-macOSintel.dmg; do
            dmg_path="$(find . -type f -name "$dmg_name" -print -quit)"
            if [ -n "$dmg_path" ]; then
              cp "$dmg_path" final-artifacts/
            else
              echo "::warning::$dmg_name was not produced; publishing this release without it."
            fi
          done

          chmod +x final-artifacts/BetterWheelWizard_Linux final-artifacts/BetterWheelWizard_ARM64_Linux
          ls -la final-artifacts/

      - name: Prepare release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## What changed"
            echo
            awk -v version="$VERSION" '
              index($0, "## [" version "]") == 1 { printing = 1; next }
              printing && /^## \[/ { exit }
              printing { print }
            ' CHANGELOG.md
          } > release-notes.md

          if ! grep -q '^### ' release-notes.md; then
            echo "No changelog entry found for $VERSION." >&2
            exit 1
          fi

          printf '%s\n' \
            '' \
            '## Downloads' \
            '' \
            '- `BetterWheelWizardWindows.exe` — Windows x64' \
            '- `BetterWheelWizard_Linux` — Linux x64' \
            '- `BetterWheelWizard_ARM64_Linux` — Linux ARM64' \
            '' \
            '> macOS packages are attached only when signing and notarization complete successfully.' \
            >> release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          TAG_NAME="${GITHUB_REF_NAME}"
          ASSETS=(final-artifacts/*)
          gh release create "$TAG_NAME" "${ASSETS[@]}" \
            --repo "$REPO" \
            --title "BetterWheelWizard $TAG_NAME" \
            --notes-file release-notes.md


