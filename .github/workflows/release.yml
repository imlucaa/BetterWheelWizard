name: Release BetterWheelWizard

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore and test
        run: |
          dotnet restore WheelWizard.sln
          dotnet test WheelWizard.sln --configuration Release --no-restore --verbosity normal

      - name: Publish Windows x64
        run: >
          dotnet publish WheelWizard/WheelWizard.csproj
          --runtime win-x64
          --configuration Release
          --output publish/win-x64
          --self-contained true
          /p:UseAppHost=true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Publish Linux x64
        run: >
          dotnet publish WheelWizard/WheelWizard.csproj
          --runtime linux-x64
          --configuration Release
          --output publish/linux-x64
          --self-contained true
          /p:UseAppHost=true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Publish Linux ARM64
        run: >
          dotnet publish WheelWizard/WheelWizard.csproj
          --runtime linux-arm64
          --configuration Release
          --output publish/linux-arm64
          --self-contained true
          /p:UseAppHost=true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true

      - name: Prepare release files
        run: |
          mkdir artifacts
          cp publish/win-x64/BetterWheelWizard.exe artifacts/BetterWheelWizard.exe
          cp publish/linux-x64/BetterWheelWizard artifacts/BetterWheelWizard_Linux
          cp publish/linux-arm64/BetterWheelWizard artifacts/BetterWheelWizard_ARM64_Linux
          chmod +x artifacts/BetterWheelWizard_Linux artifacts/BetterWheelWizard_ARM64_Linux

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          artifacts/BetterWheelWizard.exe
          artifacts/BetterWheelWizard_Linux
          artifacts/BetterWheelWizard_ARM64_Linux
          --repo "${{ github.repository }}"
          --title "BetterWheelWizard ${{ github.ref_name }}"
          --generate-notes
